<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partes diarios · GR Servicios</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; background: #eef2f5; color: #17283a; font: 16px system-ui, sans-serif }
  main { max-width: 760px; margin: auto; padding: 24px 16px }
  h1 { margin: 4px 0 24px }
  form, article { background: white; border: 1px solid #d7e0e8; border-radius: 12px; padding: 18px }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)) }
  label { display: grid; gap: 5px; font-weight: 600 }
  input, select, button { font: inherit; padding: 10px; min-height: 44px; border: 1px solid #9aaab9; border-radius: 6px }
  input, select { width: 100%; background: white; color: inherit }
  button { background: #163d59; color: white; cursor: pointer }
  button.secondary { background: white; color: #163d59 }
  article { margin: 8px 0; display: flex; align-items: center; justify-content: space-between; gap: 10px }
  output { display: block; margin: 16px 0 }
  [hidden] { display: none !important }
  .modo, .numeros, #datos-parte { margin-bottom: 16px }
  #resumen-parte { background: #eef2f5; padding: 12px; border-radius: 6px }
  form { display: grid; gap: 14px }
  form > * { margin: 0 }
  .modo { margin-bottom: 0 }
  .preferencias, .datos-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) }
  .ancho { grid-column: 1 / -1 }
  #datos-parte { margin-bottom: 0 }
  #datos-parte details { margin-top: 8px }
  .numeros { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-bottom: 0 }
  .numeros label:first-child { grid-column: 1 / -1 }
  label { font-size: .875rem }
  input, select { min-width: 0; font-size: 16px }
  #guardar { width: 100%; font-weight: 700 }
  #horas { background: #eef2f5; border-radius: 6px; padding: 8px 10px; font-size: .9rem }
  #aviso-navegador { margin: 0 0 12px; color: #734817; font-size: .875rem }
  @media (max-width: 600px) {
    main { padding: 12px 10px 24px }
    h1 { margin: 2px 0 10px; font-size: 1.4rem }
    form { padding: 12px; gap: 10px }
    .grid { gap: 8px }
    label { gap: 3px }
    input, select { padding: 6px }
  }
</style>
<main>
  <strong>GR Servicios</strong>
  <h1>Partes diarios</h1>
  <p id="aviso-navegador">Para guardar partes, abra esta página en Safari o Chrome si está en un visor de archivos.</p>
  <form id="parte">
    <div class="grid preferencias">
  <label class="modo ancho">Destino del informe
    <select id="destino" name="destino" required>
      <option value="">Seleccione un destino…</option>
      <option>Caldera</option>
      <option>Logística y Recepción</option>
      <option>Embarque de Harina</option>
    </select>
  </label>
    <label class="modo">Modo de carga
      <select id="modo"><option value="rapido">Rápido</option><option value="completo" selected>Completo</option></select>
    </label>
    </div>
    <p id="resumen-parte" hidden><span></span> <button type="button" class="secondary" id="cambiar-datos">Cambiar</button></p>
    <div id="datos-parte">
    <div class="grid datos-grid">
      <label>Fecha <input type="date" name="fecha" required></label>
      <label>Máquina <select name="codigo_maquina" required>
          <option value="">Seleccione…</option>
          <option value="WA320-1">WA320-1</option>
          <option value="WA320-2">WA320-2</option>
          <option value="624K-1">624K-1</option>
          <option value="624K-2">624K-2</option>
          <option value="524K-1">524K-1</option>
          <option value="524K-2">524K-2</option>
          <option value="ZL50">ZL50</option>
          <option value="L36">L36</option>
          <option value="ZL30-1">ZL30-1</option>
          <option value="ZL30-2">ZL30-2</option>
          <option value="HL635">HL635</option>
          <option value="PC210">PC210</option>
        </select></label>
      <label class="ancho">Operador <input name="operador" list="operadores" maxlength="100" required></label>
      <datalist id="operadores">
        <option value="ARIEL CENTURION"></option>
        <option value="CARLOS GIMENEZ"></option>
        <option value="DAVID CABRERA"></option>
        <option value="EDGAR ESPINOLA"></option>
        <option value="EMILIANO FRANCO"></option>
        <option value="FELIPE GONZALEZ"></option>
        <option value="FLORENTIN RAMOS"></option>
        <option value="GABRIEL VILLALBA"></option>
        <option value="GILBERTO QUQUEJO"></option>
        <option value="IDALINO"></option>
        <option value="JOSE CAÑETE"></option>
        <option value="JOSE PRIETO"></option>
        <option value="MARIO CACERES"></option>
        <option value="MILCIADES FRANCO"></option>
        <option value="NELSON GIMENEZ"></option>
        <option value="RAFAEL JUSTINO ESPINOZA"></option>
        <option value="RAMON MENDOZA"></option>
        <option value="RICHARD OJEDA"></option>
        <option value="WILSON CENTURION"></option>
      </datalist>
      <label class="ancho">Sector <select name="codigo_sector" required>
          <option value="">Seleccione…</option>
          <option value="1">CAIASA</option>
          <option value="2">EX UNIPORT</option>
          <option value="3">ANGOSTURA</option>
          <option value="4">PLAYAS DE CAMIONES</option>
          <option value="5">SILOS BOLSAS</option>
          <option value="6">CALDERA</option>
        </select></label>
      <label class="ancho">Trabajo <select name="codigo_trabajo" required>
          <option value="">Seleccione…</option>
          <option value="1">1 · REPARACIÓN DE CAMINO - CARGAMENTO - PERFILADO</option>
          <option value="2">2 · EMBARQUE - ALIMENTACIÓN DE REGISTROS EN CELDA</option>
          <option value="3">3 · CARGA DE PELLETS PARA VENTA</option>
          <option value="4">4 · CARGA DE HARINA PARA VENTA</option>
          <option value="5">5 · REMOLQUE DE CAMIÓN AVERIADO</option>
          <option value="6">6 · TRASILAJE - CARGA DE CAMIONES</option>
          <option value="7">7 · ENVIO DE POLVO Y CASCARILLA A CALDERA</option>
          <option value="8">8 · APOYO EN LIMPIEZA - RECUPERACIÓN DE MERCADERIA</option>
          <option value="9">9 · ENVIO DE CHAUCHA A CALDERA</option>
          <option value="10">10 · PRUEBA DE PESAJE EN BALANZAS</option>
          <option value="11">11 · CALDERA - TRABAJOS VARIOS</option>
          <option value="12">12 · VACIADO DE CELDA</option>
        </select></label>
    </div>
    <details>
      <summary>Horario opcional</summary>
      <div class="grid">
        <label>Entrada <input type="time" name="hora_entrada"></label>
        <label>Salida <input type="time" name="hora_salida"></label>
      </div>
    </details>
    </div>
    <div class="grid numeros">
      <label>Nº de boleta <input name="boleta" inputmode="numeric" pattern="[0-9]+" maxlength="24" required></label>
      <label>Horómetro inicial <input name="hora_inicial" inputmode="decimal" required></label>
      <label>Horómetro final <input name="hora_final" inputmode="decimal" required></label>
    </div>
    <output id="horas">Horas máquina: —</output>
    <button id="guardar" disabled>Guardar y cargar otra</button>
    <button class="secondary" type="button" id="cancelar" hidden>Cancelar edición</button>
  </form>
  <p id="estado" role="status"></p>
  <h2>Registros de este dispositivo</h2>
  <label><span><input type="checkbox" id="todos-destinos" style="width:auto;min-height:auto"> Mostrar todos los destinos</span></label>
  <details><summary>Configuración de envío</summary>
    <label>Clave de sincronización <input id="clave" type="password" autocomplete="off"></label>
  </details>
  <button class="secondary" id="sincronizar">Reintentar envío</button>
  <section id="registros"></section>
</main>
<script>
'use strict';
const setores = {1: "CAIASA", 2: "EX UNIPORT", 3: "ANGOSTURA", 4: "PLAYAS DE CAMIONES", 5: "SILOS BOLSAS", 6: "CALDERA"};
    const trabalhos = {
      1: ["REPARACIÓN DE CAMINO - CARGAMENTO - PERFILADO", "MANTENIMIENTO/REPARACIÓN"],
      2: ["EMBARQUE - ALIMENTACIÓN DE REGISTROS EN CELDA", "OPERACIÓN EMBARQUE"],
      3: ["CARGA DE PELLETS PARA VENTA", "OPERACIÓN EMBARQUE"],
      4: ["CARGA DE HARINA PARA VENTA", "OPERACIÓN EMBARQUE"],
      5: ["REMOLQUE DE CAMIÓN AVERIADO", "AUXILIO"],
      6: ["TRASILAJE - CARGA DE CAMIONES", "TRASILAJE"],
      7: ["ENVIO DE POLVO Y CASCARILLA A CALDERA", "LIMPIEZA"],
      8: ["APOYO EN LIMPIEZA - RECUPERACIÓN DE MERCADERIA", "LIMPIEZA"],
      9: ["ENVIO DE CHAUCHA A CALDERA", "LIMPIEZA"],
      10: ["PRUEBA DE PESAJE EN BALANZAS", "VARIOS"],
      11: ["CALDERA - TRABAJOS VARIOS", "TRABAJOS VARIOS"],
      12: ["VACIADO DE CELDA", "LIMPIEZA"]
    };


const form = document.querySelector('#parte');
const campos = form.elements;
const estado = document.querySelector('#estado');
const horas = document.querySelector('#horas');
const lista = document.querySelector('#registros');
const guardar = document.querySelector('#guardar');
const cancelar = document.querySelector('#cancelar');
const almacenamiento = 'gr-partes-diarios-v1';
const clave = document.querySelector('#clave');
try { clave.value = sessionStorage.getItem('gr-partes-clave') || ''; } catch {}
clave.addEventListener('change', () => {
  try { sessionStorage.setItem('gr-partes-clave', clave.value.trim()); } catch {}
  sincronizar();
});
let registros = [];
let editando = null;
let enviando = false;

const modo = document.querySelector('#modo');
const datosParte = document.querySelector('#datos-parte');
const resumenParte = document.querySelector('#resumen-parte');
const resumenTexto = resumenParte.querySelector('span');
const camposComunes = ['fecha', 'codigo_maquina', 'operador', 'codigo_sector', 'codigo_trabajo'];

try {
  if (localStorage.getItem('gr-partes-modo') === 'rapido') modo.value = 'rapido';
} catch {}

function mostrarDatos(visibles) {
  datosParte.hidden = !visibles;
  resumenParte.hidden = visibles;
  if (!visibles) {
    resumenTexto.textContent = [
      campos.fecha.value, campos.codigo_maquina.value, campos.operador.value,
      setores[campos.codigo_sector.value], trabalhos[campos.codigo_trabajo.value]?.[0]
    ].join(' · ');
  }
}

function aplicarModo() {
  const completos = camposComunes.every(nombre => campos[nombre].value.trim());
  mostrarDatos(modo.value === 'completo' || !completos || Boolean(editando));
}

modo.addEventListener('change', () => {
  try { localStorage.setItem('gr-partes-modo', modo.value); } catch {}
  aplicarModo();
});

document.querySelector('#cambiar-datos').addEventListener('click', () => {
  mostrarDatos(true);
  campos.codigo_maquina.focus();
});

datosParte.addEventListener('invalid', () => mostrarDatos(true), true);

const destino = document.querySelector('#destino');
const todosDestinos = document.querySelector('#todos-destinos');

function actualizarDestino() {
  try { localStorage.setItem('gr-partes-destino', destino.value); } catch {}
  renderizar();
}

try { destino.value = localStorage.getItem('gr-partes-destino') || ''; } catch {}
destino.addEventListener('change', actualizarDestino);
destino.addEventListener('input', actualizarDestino);
todosDestinos.addEventListener('change', renderizar);

campos.fecha.value = new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Asuncion' }).format(new Date());

function lectura(valor) {
  const limpio = String(valor).trim();
  if (/^\d+(?:[.,]\d)?$/.test(limpio)) return Number(limpio.replace(',', '.'));
  if (/^\d{1,3}(?:\.\d{3})+,\d$/.test(limpio)) return Number(limpio.replaceAll('.', '').replace(',', '.'));
  return NaN;
}

function diferencia() {
  const inicio = lectura(campos.hora_inicial.value);
  const fin = lectura(campos.hora_final.value);
  return Number.isFinite(inicio) && Number.isFinite(fin) && fin >= inicio
    ? Math.round((fin - inicio) * 10) / 10 : NaN;
}

function mostrarHoras() {
  const total = diferencia();
  horas.textContent = 'Horas máquina: ' + (Number.isFinite(total) ? total.toFixed(1).replace('.', ',') : '—');
}

function persistir(nuevos) {
  localStorage.setItem(almacenamiento, JSON.stringify(nuevos));
  registros = nuevos;
}

function renderizar() {
  lista.replaceChildren();
  for (const item of [...registros].reverse()) {
    if (!todosDestinos.checked && item.destino && item.destino !== destino.value) continue;
    const fila = document.createElement('article');
    const texto = document.createElement('span');
    texto.textContent = [item.fecha, item.boleta, item.codigo_maquina,
      item.destino || 'Sin destino', item.sector_nombre, item.horas_trabajadas + ' h', item.estado].join(' · ');
    const editar = document.createElement('button');
    editar.type = 'button';
    editar.className = 'secondary';
    editar.textContent = 'Editar';
    editar.onclick = () => {
      editando = item.id;
      for (const campo of campos) {
        if (campo.name && campo.name in item) campo.value = item[campo.name];
      }
      guardar.textContent = 'Guardar cambios';
      cancelar.hidden = false;
      actualizarDestino();
      mostrarDatos(true);
      mostrarHoras();
      (destino.value ? campos.boleta : destino).focus();
    };
    fila.append(texto, editar);
    lista.append(fila);
  }
}

function nuevoParte() {
  editando = null;
  guardar.textContent = 'Guardar y cargar otra';
  cancelar.hidden = true;
  for (const nombre of ['boleta', 'hora_inicial', 'hora_final', 'hora_entrada', 'hora_salida']) {
    campos[nombre].value = '';
  }
  aplicarModo();
  mostrarHoras();
  campos.boleta.focus();
}

async function sincronizar() {
  if (enviando || !navigator.onLine || !clave.value.trim()) return;
  enviando = true;
  try {
    const pendientes = new Set(registros.filter(registro => registro.estado !== 'Sincronizado'));
    while (pendientes.size) {
      const item = pendientes.values().next().value;
      pendientes.delete(item);
      const actual = registros.find(registro => registro.id === item.id);
      if (actual !== item) continue;
      let estadoEnvio = 'Error de envío';
      try {
        const respuesta = await fetch('/api/partes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + clave.value.trim() },
          body: JSON.stringify(item),
          signal: AbortSignal.timeout(20000)
        });
        if (respuesta.ok && (await respuesta.json()).id === item.id) estadoEnvio = 'Sincronizado';
      } catch {
        estadoEnvio = navigator.onLine ? 'Error de envío' : 'Pendiente';
      }
      persistir(registros.map(registro => registro === item ? { ...item, estado: estadoEnvio } : registro));
      renderizar();
      for (const registro of registros) {
        if (registro !== item && registro.estado === 'Pendiente' && navigator.onLine) pendientes.add(registro);
      }
    }
  } catch {
    estado.textContent = 'No se pudo guardar el estado en este dispositivo.';
  } finally {
    enviando = false;
  }
}

form.addEventListener('input', mostrarHoras);
form.addEventListener('submit', evento => {
  evento.preventDefault();
  if (!Number.isFinite(diferencia())) {
    estado.textContent = 'Revise los horómetros. El final debe ser igual o mayor al inicial.';
    return;
  }
  const datos = Object.fromEntries(new FormData(form));
  datos.operador = datos.operador.trim();
  if (!datos.operador) {
    estado.textContent = 'Indique el operador.';
    return;
  }
  if (registros.some(item => item.id !== editando &&
      item.boleta.replace(/^0+(?=\d)/, '') === datos.boleta.replace(/^0+(?=\d)/, ''))) {
    estado.textContent = 'La boleta ya está registrada en este dispositivo.';
    return;
  }
  const existente = registros.find(item => item.id === editando);
  const parte = {
    ...datos,
    id: editando || crypto.randomUUID(),
    revision: (existente?.revision || 0) + 1,
    sector_nombre: setores[datos.codigo_sector],
    descripcion_trabajo: trabalhos[datos.codigo_trabajo][0],
    tipo_trabajo: trabalhos[datos.codigo_trabajo][1],
    hora_inicial: lectura(datos.hora_inicial),
    hora_final: lectura(datos.hora_final),
    horas_trabajadas: diferencia(),
    estado: 'Pendiente'
  };
  try {
    persistir(editando ? registros.map(item => item.id === editando ? parte : item) : [...registros, parte]);
  } catch {
    estado.textContent = 'No se pudo guardar. Sus datos siguen en el formulario.';
    return;
  }
  estado.textContent = 'Guardado en este dispositivo.';
  nuevoParte();
  renderizar();
  sincronizar();
});

try {
  registros = JSON.parse(localStorage.getItem(almacenamiento) || '[]');
  if (!Array.isArray(registros)) throw new Error();
  renderizar();
  guardar.disabled = false;
  document.querySelector("#aviso-navegador").hidden = true;
  sincronizar();
} catch {
  guardar.disabled = true;
  estado.textContent = 'No se pudo leer el almacenamiento del dispositivo.';
}
cancelar.onclick = nuevoParte;
document.querySelector('#sincronizar').onclick = sincronizar;
window.addEventListener('online', sincronizar);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
</html>
